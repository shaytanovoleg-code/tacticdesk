<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Тактична дошка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
  font-family: Arial, sans-serif; background: #0a1929; color: #e3f2fd;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  position: fixed; width: 100%; top: 0; left: 0; right: 0; bottom: 0; }

#controls {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)) 12px;
  background: #061321;
  z-index: 50;
}
#controls button {
  background: #1565c0; color: #ffffff; border: 1px solid #42a5f5;
  border-radius: 12px; padding: 0; font-size: 26px; cursor: pointer;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s; line-height: 1;
}
#controls button:active:not(:disabled) { background: #1976d2; }
#controls button:disabled { opacity: .35; }
#controls .save { background: #ffc107; color: #000; border-color: #ffca28; font-size: 26px; }
#controls .save:active:not(:disabled) { background: #ffca28; }
#controls .close {
  background: #455a64; border-color: #607d8b;
  font-size: 12px; font-weight: bold; letter-spacing: 1px;
  width: auto; padding: 0 14px; height: 52px;
}
#step-indicator { font-size: 20px; font-weight: bold; color: #64b5f6;
  min-width: 30px; text-align: center; }

#board-view {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 6px;
}

#field-outer {
  position: relative;
  aspect-ratio: 1 / 2;
  height: calc(85% - 30px);
  width: auto;
  max-width: calc(85% - 30px);
  padding: 15px;
  background: #a8dadc;
  border-radius: 8px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
}

#field {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: #a8dadc;
  background-image: url("field.svg");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center;
  border: none;
  border-radius: 4px;
  overflow: visible;
}

.piece {
  position: absolute;
  border-radius: 50%;
  border: 2px solid #000;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.5);
  touch-action: none;
  z-index: 10;
  transform: translate(-50%, -50%);
}
.piece:active { cursor: grabbing; z-index: 999; }

.piece.home    { background: #facc15; }
.piece.gk-home { background: #2563eb; }
.piece.away    { background: #dc2626; }
.piece.gk-away { background: #1a1a1a; border-color: #555; }

.piece.ball {
  border: 2px solid #111;
  border-radius: 50%;
  z-index: 20;
  overflow: hidden;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f0f0f0 55%, #d0d0d0 100%);
  box-shadow: 0 2px 4px rgba(0,0,0,.55), inset -2px -2px 4px rgba(0,0,0,.15);
}
.piece.ball::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 34%; height: 34%;
  background: #111;
  transform: translate(-50%, -50%);
  clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
}
.piece.ball::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle 7% at 50% 8%,  #111 100%, transparent 101%),
    radial-gradient(circle 7% at 50% 92%, #111 100%, transparent 101%),
    radial-gradient(circle 7% at 8% 50%,  #111 100%, transparent 101%),
    radial-gradient(circle 7% at 92% 50%, #111 100%, transparent 101%),
    radial-gradient(circle 6% at 22% 22%, #111 100%, transparent 101%),
    radial-gradient(circle 6% at 78% 22%, #111 100%, transparent 101%),
    radial-gradient(circle 6% at 22% 78%, #111 100%, transparent 101%),
    radial-gradient(circle 6% at 78% 78%, #111 100%, transparent 101%);
  pointer-events: none;
}

.piece.animated { transition: left 1.2s ease-in-out, top 1.2s ease-in-out; }

#saved-view {
  position: fixed;
  top: 0; left: 0; right: 0;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; padding: 12px; display: none;
  background: #0a1929;
  z-index: 40;
}
#saved-view.show { display: block; }
.saved-item { background: #0d2137; border: 1px solid #2196f3; border-radius: 10px;
  padding: 12px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center; }
.saved-item .name { font-weight: bold; color: #e3f2fd; }
.saved-item .meta { font-size: 12px; color: #64b5f6; }
.saved-item button { background: #1565c0; border: none; color: #fff;
  border-radius: 8px; padding: 8px 12px; cursor: pointer; }

#save-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.7); display: none;
  align-items: center; justify-content: center; z-index: 100; }
#save-modal.show { display: flex; }
.modal { background: #0d2137; padding: 20px; border-radius: 14px;
  width: 84%; max-width: 340px; text-align: center;
  border: 1px solid #2196f3; }
.modal h3 { margin: 0 0 14px; color: #e3f2fd; }
.modal input { width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid #2196f3; background: #061321; color: #fff;
  font-size: 15px; margin-bottom: 12px; }
.modal .row { display: flex; gap: 8px; }
.modal button { flex: 1; padding: 10px; border-radius: 8px; border: none;
  font-size: 15px; font-weight: bold; cursor: pointer; }
.modal .ok { background: #1565c0; color: #fff; }
.modal .cancel { background: #455a64; color: #fff; }
</style>
</head>
<body>

<div id="board-view">
  <div id="field-outer">
    <div id="field"></div>
  </div>
</div>

<div id="saved-view"></div>

<div id="controls">
  <button id="btn-back">⏪</button>
  <button id="btn-play">▶</button>
  <button id="btn-fwd">⏩</button>
  <span id="step-indicator">0</span>
  <button id="btn-save" class="save">💾</button>
  <button id="btn-close" class="close">НАЗАД</button>
</div>

<div id="save-modal">
  <div class="modal">
    <h3>💾 Зберегти комбінацію</h3>
    <input id="save-name" type="text" placeholder="Назва" maxlength="60">
    <div class="row">
      <button class="cancel" id="save-cancel">Скасувати</button>
      <button class="ok" id="save-ok">Зберегти</button>
    </div>
  </div>
</div>

<script>
var INITIAL = [
  { id: "h-gk", team: "gk-home", x: 50, y: 92 },
  { id: "h-1",  team: "home",    x: 22, y: 75 },
  { id: "h-2",  team: "home",    x: 78, y: 75 },
  { id: "h-3",  team: "home",    x: 22, y: 58 },
  { id: "h-4",  team: "home",    x: 78, y: 58 },
  { id: "a-gk", team: "gk-away", x: 50, y: 8  },
  { id: "a-1",  team: "away",    x: 22, y: 25 },
  { id: "a-2",  team: "away",    x: 78, y: 25 },
  { id: "a-3",  team: "away",    x: 22, y: 42 },
  { id: "a-4",  team: "away",    x: 78, y: 42 },
  { id: "ball", team: "ball",    x: 50, y: 50 }
];

var pieces = [];
var frames = [];
var currentFrame = 0;
var isAnimating = false;
var field = document.getElementById("field");
var fieldOuter = document.getElementById("field-outer");

var ANIM_DURATION = 1200;
var PLAY_PAUSE = 1400;
var OFFSET_LIMIT = 4;

var PIECE_SIZE_PX = 34;
var BALL_SIZE_PX = 30;

function updatePieceSizes() {
  var fieldWidth = field.offsetWidth;
  PIECE_SIZE_PX = Math.max(22, Math.round(fieldWidth * 0.098));
  BALL_SIZE_PX = Math.max(19, Math.round(fieldWidth * 0.078));
}

function render() {
  field.innerHTML = "";
  updatePieceSizes();
  for (var i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    var el = document.createElement("div");
    el.className = "piece " + p.team;
    el.setAttribute("data-id", p.id);
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";
    var size = (p.team === "ball") ? BALL_SIZE_PX : PIECE_SIZE_PX;
    el.style.width = size + "px";
    el.style.height = size + "px";
    field.appendChild(el);
    makeDraggable(el, p);
  }
  updateControls();
}

function clone(src) {
  var out = [];
  for (var i = 0; i < src.length; i++) {
    out.push({ id: src[i].id, team: src[i].team, x: src[i].x, y: src[i].y });
  }
  return out;
}

function makeDraggable(el, piece) {
  var dragging = false, sx, sy, spx, spy, moved;

  function down(e) {
    if (isAnimating) return;
    e.preventDefault();
    dragging = true; moved = false;
    var pt = pos(e);
    sx = pt.x; sy = pt.y;
    spx = piece.x; spy = piece.y;
  }
  function move(e) {
    if (!dragging) return;
    e.preventDefault();
    var pt = pos(e);
    var r = field.getBoundingClientRect();
    var dx = ((pt.x - sx) / r.width) * 100;
    var dy = ((pt.y - sy) / r.height) * 100;
    if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) moved = true;

    var minX = -OFFSET_LIMIT, maxX = 100 + OFFSET_LIMIT;
    var minY = -OFFSET_LIMIT, maxY = 100 + OFFSET_LIMIT;

    var nx = Math.max(minX, Math.min(maxX, spx + dx));
    var ny = Math.max(minY, Math.min(maxY, spy + dy));
    piece.x = nx; piece.y = ny;
    el.style.left = nx + "%";
    el.style.top = ny + "%";
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    if (moved) frames[currentFrame] = clone(pieces);
  }

  el.addEventListener("mousedown", down);
  el.addEventListener("touchstart", down, { passive: false });
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive: false });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);
}

function pos(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function goto(idx, animate) {
  if (idx < 0 || idx >= frames.length) return;
  currentFrame = idx;
  var target = frames[idx];
  if (!animate) {
    pieces = clone(target);
    render();
    return;
  }
  isAnimating = true;
  var nodes = field.querySelectorAll(".piece");
  var map = {};
  for (var i = 0; i < nodes.length; i++) map[nodes[i].getAttribute("data-id")] = nodes[i];
  for (var j = 0; j < target.length; j++) {
    var t = target[j];
    var el = map[t.id];
    if (!el) continue;
    el.classList.add("animated");
    el.style.left = t.x + "%";
    el.style.top = t.y + "%";
  }
  setTimeout(function() {
    pieces = clone(target);
    render();
    isAnimating = false;
  }, ANIM_DURATION);
}

function updateControls() {
  document.getElementById("step-indicator").textContent = currentFrame;
  document.getElementById("btn-back").disabled = currentFrame <= 0;
  document.getElementById("btn-fwd").disabled = false;
  document.getElementById("btn-play").disabled = frames.length < 2;
}

document.getElementById("btn-back").onclick = function() {
  if (currentFrame <= 0) return;
  frames.splice(currentFrame, 1);
  if (frames.length === 0) {
    frames = [clone(INITIAL)];
    currentFrame = 0;
  } else {
    currentFrame = Math.min(currentFrame, frames.length - 1);
  }
  pieces = clone(frames[currentFrame]);
  render();
};

document.getElementById("btn-fwd").onclick = function() {
  if (isAnimating) return;
  if (currentFrame < frames.length - 1) {
    frames = frames.slice(0, currentFrame + 1);
  }
  frames[currentFrame] = clone(pieces);
  frames.push(clone(pieces));
  currentFrame = frames.length - 1;
  updateControls();
};

document.getElementById("btn-play").onclick = function() {
  if (isAnimating) return;
  var startIdx = 1;
  var endIdx = frames.length - 1;
  if (endIdx < startIdx) return;

  isAnimating = true;

  pieces = clone(frames[startIdx]);
  render();
  currentFrame = startIdx;
  updateControls();

  var i = startIdx + 1;
  function step() {
    if (i > endIdx) {
      isAnimating = false;
      return;
    }
    goto(i, true);
    i++;
    setTimeout(step, PLAY_PAUSE);
  }
  setTimeout(step, 400);
};

document.getElementById("btn-save").onclick = function() {
  document.getElementById("save-name").value = "";
  document.getElementById("save-modal").classList.add("show");
  document.getElementById("save-name").focus();
};
document.getElementById("save-cancel").onclick = function() {
  document.getElementById("save-modal").classList.remove("show");
};
document.getElementById("save-ok").onclick = function() {
  var name = document.getElementById("save-name").value.trim();
  if (!name) { alert("Введіть назву"); return; }
  var item = { name: name, frames: frames, ts: Date.now() };
  var list = JSON.parse(localStorage.getItem("tactics_saved") || "[]");
  list.push(item);
  localStorage.setItem("tactics_saved", JSON.stringify(list));
  if (window.Telegram && Telegram.WebApp && Telegram.WebApp.sendData) {
    try {
      Telegram.WebApp.sendData(JSON.stringify({
        action: "save_tactic", name: name,
        frames_count: frames.length, frames: frames
      }));
    } catch (e) {}
  }
  document.getElementById("save-modal").classList.remove("show");
  alert("Збережено: " + name);
};

if (window.Telegram && Telegram.WebApp) {
  var tg = Telegram.WebApp;
  tg.ready();
  tg.expand();
  if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
  if (tg.setHeaderColor) tg.setHeaderColor("#0a1929");
  if (tg.setBackgroundColor) tg.setBackgroundColor("#0a1929");
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  if (tg.BackButton && tg.BackButton.hide) tg.BackButton.hide();
  document.getElementById("btn-close").onclick = function() { tg.close(); };
} else {
  document.getElementById("btn-close").onclick = function() {
    if (history.length > 1) history.back();
  };
}

window.addEventListener("resize", function() {
  updatePieceSizes();
  render();
});
window.addEventListener("orientationchange", function() {
  setTimeout(function() { updatePieceSizes(); render(); }, 300);
});

pieces = clone(INITIAL);
frames = [clone(INITIAL)];
currentFrame = 0;
render();
</script>
</body>
</html>
