<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тактична дошка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
  font-family: Arial, sans-serif; background: #0b3d1a; color: #fff; }
#header { padding: 8px 12px; background: #08270f;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 15px; font-weight: 600; }
#header .title { color: #7ee787; }
#btn-view-saved { background: none; border: 1px solid #2c7a4b; color: #fff;
  border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }

#board-view { position: absolute; top: 42px; left: 0; right: 0; bottom: 68px; }
#field { position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  height: calc(100% - 12px); width: auto; aspect-ratio: 2 / 3;
  background-color: #a8dadc;
  background-image: url("field.svg");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center;
  border: 2px solid #000; border-radius: 6px;
  overflow: visible; }

.piece { position: absolute; width: 8%; height: 5.3%;
  margin-left: -4%; margin-top: -2.65%;
  border-radius: 50%; border: 2px solid #000;
  cursor: grab; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.5);
  touch-action: none; user-select: none; z-index: 10; }
.piece:active { cursor: grabbing; z-index: 999; }

.piece.home    { background: #facc15; }
.piece.gk-home { background: #2563eb; }
.piece.away    { background: #dc2626; }
.piece.gk-away { background: #1a1a1a; border-color: #555; }

.piece.ball {
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f0f0f0 45%, #c8c8c8 100%);
  width: 6.5%; height: 4.3%;
  margin-left: -3.25%; margin-top: -2.15%;
  border: 2px solid #111;
  border-radius: 50%;
  z-index: 20;
  box-shadow: 0 2px 5px rgba(0,0,0,.6), inset -2px -2px 4px rgba(0,0,0,.15);
  overflow: hidden;
}
.piece.ball::before {
  content: "";
  position: absolute;
  width: 30%;
  height: 30%;
  background: #111;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
}
.piece.ball::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle 12% at 20% 20%, #111 100%, transparent 100%),
    radial-gradient(circle 12% at 80% 20%, #111 100%, transparent 100%),
    radial-gradient(circle 12% at 20% 80%, #111 100%, transparent 100%),
    radial-gradient(circle 12% at 80% 80%, #111 100%, transparent 100%),
    radial-gradient(circle 12% at 50% 5%,  #111 100%, transparent 100%),
    radial-gradient(circle 12% at 50% 95%, #111 100%, transparent 100%),
    radial-gradient(circle 12% at 5% 50%,  #111 100%, transparent 100%),
    radial-gradient(circle 12% at 95% 50%, #111 100%, transparent 100%);
  pointer-events: none;
}

/* АНІМАЦІЯ — повільніша */
.piece.animated { transition: left 1.2s ease-in-out, top 1.2s ease-in-out; }

#controls { position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center; align-items: center; gap: 8px;
  padding: 10px; background: #08270f; }
#controls button { background: #124d29; color: #fff; border: 1px solid #2c7a4b;
  border-radius: 10px; padding: 10px 14px; font-size: 16px; cursor: pointer;
  min-width: 50px; }
#controls button:disabled { opacity: .35; }
#controls .save { background: #b8860b; border-color: #d4a017; }
#step-indicator { font-size: 18px; font-weight: bold; color: #9be49b;
  min-width: 30px; text-align: center; }

#saved-view { position: absolute; top: 42px; left: 0; right: 0; bottom: 68px;
  overflow-y: auto; padding: 12px; display: none; }
#saved-view.show { display: block; }
.saved-item { background: #124d29; border: 1px solid #2c7a4b; border-radius: 10px;
  padding: 12px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center; }
.saved-item .name { font-weight: bold; }
.saved-item .meta { font-size: 12px; color: #9be49b; }
.saved-item button { background: #b8860b; border: none; color: #fff;
  border-radius: 8px; padding: 8px 12px; cursor: pointer; }

#save-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.7); display: none;
  align-items: center; justify-content: center; z-index: 100; }
#save-modal.show { display: flex; }
.modal { background: #0e3a1c; padding: 20px; border-radius: 14px;
  width: 84%; max-width: 340px; text-align: center; }
.modal h3 { margin: 0 0 14px; }
.modal input { width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid #2c7a4b; background: #08270f; color: #fff;
  font-size: 15px; margin-bottom: 12px; }
.modal .row { display: flex; gap: 8px; }
.modal button { flex: 1; padding: 10px; border-radius: 8px; border: none;
  font-size: 15px; font-weight: bold; cursor: pointer; }
.modal .ok { background: #1a6b39; color: #fff; }
.modal .cancel { background: #4a4a4a; color: #fff; }
</style>
</head>
<body>

<div id="header">
  <span class="title">🎯 ТАКТИЧНА ДОШКА</span>
  <button id="btn-view-saved">Збережене</button>
</div>

<div id="board-view">
  <div id="field"></div>
</div>

<div id="saved-view"></div>

<div id="controls">
  <button id="btn-back">⏪</button>
  <button id="btn-play">▶</button>
  <button id="btn-fwd">⏩</button>
  <span id="step-indicator">1</span>
  <button id="btn-save" class="save">💾</button>
  <button id="btn-close" style="background:#4a4a4a;">⬅️</button>
</div>

<div id="save-modal">
  <div class="modal">
    <h3>💾 Зберегти комбінацію</h3>
    <input id="save-name" type="text" placeholder="Назва" maxlength="60">
    <div class="row">
      <button class="cancel" id="save-cancel">Скасувати</button>
      <button class="ok" id="save-ok">Зберегти</button>
    </div>
  </div>
</div>

<script>
var INITIAL = [
  { id: "h-gk", team: "gk-home", x: 50, y: 92 },
  { id: "h-1",  team: "home",    x: 22, y: 75 },
  { id: "h-2",  team: "home",    x: 78, y: 75 },
  { id: "h-3",  team: "home",    x: 22, y: 58 },
  { id: "h-4",  team: "home",    x: 78, y: 58 },
  { id: "a-gk", team: "gk-away", x: 50, y: 8  },
  { id: "a-1",  team: "away",    x: 22, y: 25 },
  { id: "a-2",  team: "away",    x: 78, y: 25 },
  { id: "a-3",  team: "away",    x: 22, y: 42 },
  { id: "a-4",  team: "away",    x: 78, y: 42 },
  { id: "ball", team: "ball",    x: 50, y: 50 }
];

var pieces = [];
var frames = [];
var currentFrame = 0;
var isAnimating = false;
var field = document.getElementById("field");

// Тривалість анімації (мс) — має співпадати з transition у CSS
var ANIM_DURATION = 1200;
// Пауза між кадрами під час відтворення
var PLAY_PAUSE = 1400;

function render() {
  field.innerHTML = "";
  for (var i = 0; i < pieces.length; i++) {
    var p = pieces[i];
    var el = document.createElement("div");
    el.className = "piece " + p.team;
    el.setAttribute("data-id", p.id);
    el.style.left = p.x + "%";
    el.style.top = p.y + "%";
    field.appendChild(el);
    makeDraggable(el, p);
  }
  updateControls();
}

function clone(src) {
  var out = [];
  for (var i = 0; i < src.length; i++) {
    out.push({ id: src[i].id, team: src[i].team, x: src[i].x, y: src[i].y });
  }
  return out;
}

function makeDraggable(el, piece) {
  var dragging = false, sx, sy, spx, spy, moved;

  function down(e) {
    if (isAnimating) return;
    e.preventDefault();
    dragging = true; moved = false;
    var pt = pos(e);
    sx = pt.x; sy = pt.y;
    spx = piece.x; spy = piece.y;
  }
  function move(e) {
    if (!dragging) return;
    e.preventDefault();
    var pt = pos(e);
    var r = field.getBoundingClientRect();
    var dx = ((pt.x - sx) / r.width) * 100;
    var dy = ((pt.y - sy) / r.height) * 100;
    if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) moved = true;

    var minX = 3, maxX = 97, minY = 2, maxY = 98;
    if (piece.team === "ball") {
      minX = -8; maxX = 108;
      minY = -8; maxY = 108;
    }

    var nx = Math.max(minX, Math.min(maxX, spx + dx));
    var ny = Math.max(minY, Math.min(maxY, spy + dy));
    piece.x = nx; piece.y = ny;
    el.style.left = nx + "%";
    el.style.top = ny + "%";
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    if (moved) frames[currentFrame] = clone(pieces);
  }

  el.addEventListener("mousedown", down);
  el.addEventListener("touchstart", down, { passive: false });
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive: false });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);
}

function pos(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function goto(idx, animate) {
  if (idx < 0 || idx >= frames.length) return;
  currentFrame = idx;
  var target = frames[idx];
  if (!animate) {
    pieces = clone(target);
    render();
    return;
  }
  isAnimating = true;
  var nodes = field.querySelectorAll(".piece");
  var map = {};
  for (var i = 0; i < nodes.length; i++) map[nodes[i].getAttribute("data-id")] = nodes[i];
  for (var j = 0; j < target.length; j++) {
    var t = target[j];
    var el = map[t.id];
    if (!el) continue;
    el.classList.add("animated");
    el.style.left = t.x + "%";
    el.style.top = t.y + "%";
  }
  setTimeout(function() {
    pieces = clone(target);
    render();
    isAnimating = false;
  }, ANIM_DURATION);
}

function updateControls() {
  // Просто поточна цифра кадру
  document.getElementById("step-indicator").textContent = currentFrame + 1;
  document.getElementById("btn-back").disabled = currentFrame <= 0;
  document.getElementById("btn-fwd").disabled = false;
  document.getElementById("btn-play").disabled = frames.length < 2;
}

document.getElementById("btn-back").onclick = function() {
  if (currentFrame > 0) goto(currentFrame - 1, false);
};

document.getElementById("btn-fwd").onclick = function() {
  frames[currentFrame] = clone(pieces);
  frames.push(clone(pieces));
  currentFrame = frames.length - 1;
  updateControls();
};

document.getElementById("btn-play").onclick = function() {
  if (frames.length < 2 || isAnimating) return;
  goto(0, false);
  var i = 1;
  function step() {
    if (i >= frames.length) return;
    goto(i, true);
    i++;
    setTimeout(step, PLAY_PAUSE);
  }
  setTimeout(step, 300);
};

document.getElementById("btn-save").onclick = function() {
  document.getElementById("save-name").value = "";
  document.getElementById("save-modal").classList.add("show");
  document.getElementById("save-name").focus();
};
document.getElementById("save-cancel").onclick = function() {
  document.getElementById("save-modal").classList.remove("show");
};
document.getElementById("save-ok").onclick = function() {
  var name = document.getElementById("save-name").value.trim();
  if (!name) { alert("Введіть назву"); return; }
  var item = { name: name, frames: frames, ts: Date.now() };
  var list = JSON.parse(localStorage.getItem("tactics_saved") || "[]");
  list.push(item);
  localStorage.setItem("tactics_saved", JSON.stringify(list));
  if (window.Telegram && Telegram.WebApp && Telegram.WebApp.sendData) {
    try {
      Telegram.WebApp.sendData(JSON.stringify({
        action: "save_tactic", name: name,
        frames_count: frames.length, frames: frames
      }));
    } catch (e) {}
  }
  document.getElementById("save-modal").classList.remove("show");
  alert("Збережено: " + name);
};

document.getElementById("btn-view-saved").onclick = function() {
  var sv = document.getElementById("saved-view");
  var bv = document.getElementById("board-view");
  if (sv.classList.contains("show")) {
    sv.classList.remove("show");
    bv.style.display = "";
    document.getElementById("btn-view-saved").textContent = "Збережене";
  } else {
    sv.classList.add("show");
    bv.style.display = "none";
    document.getElementById("btn-view-saved").textContent = "До дошки";
    renderSaved();
  }
};

function renderSaved() {
  var list = JSON.parse(localStorage.getItem("tactics_saved") || "[]");
  var sv = document.getElementById("saved-view");
  sv.innerHTML = "";
  if (!list.length) {
    sv.innerHTML = '<div style="text-align:center;padding:30px;color:#9be49b;">Поки немає збережених комбінацій</div>';
    return;
  }
  for (var i = list.length - 1; i >= 0; i--) {
    var item = list[i];
    var div = document.createElement("div");
    div.className = "saved-item";
    var date = new Date(item.ts).toLocaleString("uk-UA");
    div.innerHTML = '<div><div class="name">' + item.name +
      '</div><div class="meta">Кадрів: ' + item.frames.length + ' · ' + date +
      '</div></div>';
    var btn = document.createElement("button");
    btn.textContent = "▶ Відкрити";
    (function(it) {
      btn.onclick = function() {
        frames = [];
        for (var k = 0; k < it.frames.length; k++) frames.push(clone(it.frames[k]));
        currentFrame = 0;
        pieces = clone(frames[0]);
        document.getElementById("saved-view").classList.remove("show");
        document.getElementById("board-view").style.display = "";
        document.getElementById("btn-view-saved").textContent = "Збережене";
        render();
      };
    })(item);
    div.appendChild(btn);
    sv.appendChild(div);
  }
}

if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  document.getElementById("btn-close").onclick = function() { Telegram.WebApp.close(); };
} else {
  document.getElementById("btn-close").onclick = function() { history.back(); };
}

pieces = clone(INITIAL);
frames = [clone(INITIAL)];
currentFrame = 0;
render();
</script>
</body>
</html>
